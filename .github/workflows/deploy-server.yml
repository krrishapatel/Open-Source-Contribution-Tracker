name: Deploy Server

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "package*.json"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
