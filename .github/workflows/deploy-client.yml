name: Deploy Client

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "package*.json"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build --workspace client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy with Vercel
        run: npx vercel deploy client/dist --prod --token=${{ secrets.VERCEL_TOKEN }}
